name: BrowserStack Web Tests

# Run web tests on BrowserStack: Actions tab > BrowserStack Web Tests > Run workflow.
# Also runs on pushes / PRs to main (js-mocha) and nightly.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which suite to run'
        type: choice
        required: true
        default: js-mocha
        options:
          - js-mocha
          - java-testng
      BROWSERSTACK_USERNAME:
        description: 'BrowserStack username (leave empty to use the repo secret)'
        type: string
        required: false
      BROWSERSTACK_ACCESS_KEY:
        description: 'BrowserStack access key (leave empty to use the repo secret)'
        type: string
        required: false
      build_name:
        description: 'Optional build name override (leave empty to use browserstack.yml)'
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: browserstack-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: ${{ github.event.inputs.project || 'js-mocha' }}
  BROWSERSTACK_BUILD_NAME: ${{ github.event.inputs.build_name }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  web:
    name: Web / ${{ github.event.inputs.project || 'js-mocha' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.event.inputs.project || 'js-mocha' }}
    steps:
      - uses: actions/checkout@v4

      # Load & mask BrowserStack credentials. Run inputs win; push/PR/schedule runs fall back to repo secrets.
      # Secrets are passed through env (not inlined in the script) and masked before they reach GITHUB_ENV.
      - name: Load BrowserStack credentials
        shell: bash
        working-directory: .
        env:
          SECRET_USER: ${{ secrets.BROWSERSTACK_USERNAME }}
          SECRET_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set +x

          BS_USER=$(jq -r '.inputs.BROWSERSTACK_USERNAME // empty' "$GITHUB_EVENT_PATH")
          BS_KEY=$(jq -r '.inputs.BROWSERSTACK_ACCESS_KEY // empty' "$GITHUB_EVENT_PATH")
          BS_USER="${BS_USER:-$SECRET_USER}"
          BS_KEY="${BS_KEY:-$SECRET_KEY}"

          if [ -z "$BS_USER" ]; then
            echo "BrowserStack username missing (enter it as a run input or set the BROWSERSTACK_USERNAME secret)."
            exit 1
          fi

          if [ -z "$BS_KEY" ]; then
            echo "BrowserStack access key missing (enter it as a run input or set the BROWSERSTACK_ACCESS_KEY secret)."
            exit 1
          fi

          echo "::add-mask::$BS_USER"
          echo "::add-mask::$BS_KEY"

          echo "BROWSERSTACK_USERNAME=$BS_USER" >> "$GITHUB_ENV"
          echo "BROWSERSTACK_ACCESS_KEY=$BS_KEY" >> "$GITHUB_ENV"

          echo "BrowserStack credentials loaded successfully."

      - name: Set up Node.js
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ github.event.inputs.project || 'js-mocha' }}/package-lock.json

      - name: Set up Java
        if: github.event.inputs.project == 'java-testng'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Install dependencies (JS)
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        run: npm ci

      - name: Run tests on BrowserStack (JS)
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        run: npm test

      - name: Run tests on BrowserStack (Java)
        if: github.event.inputs.project == 'java-testng'
        run: mvn --batch-mode test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.event.inputs.project || 'js-mocha' }}-logs
          path: |
            ${{ github.event.inputs.project || 'js-mocha' }}/log/
            ${{ github.event.inputs.project || 'js-mocha' }}/logs/
          if-no-files-found: ignore
