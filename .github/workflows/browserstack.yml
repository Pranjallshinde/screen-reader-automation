name: BrowserStack Tests

# Trigger any flow manually (Actions tab > BrowserStack Tests > Run workflow),
# on pushes / PRs to main, or on a nightly schedule.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'What to test'
        type: choice
        required: true
        default: web
        options:
          - web
          - app
      project:
        description: 'Web only: which suite to run'
        type: choice
        required: false
        default: js-mocha
        options:
          - js-mocha
          - java-testng
      build_name:
        description: 'Optional build name override (leave empty to use browserstack.yml)'
        type: string
        required: false
      app:
        description: 'App only: local path (e.g. ./app.apk) or an existing bs:// app id / custom id'
        type: string
        required: false
      app_dir:
        description: 'App only: directory of the app test project'
        type: string
        required: false
        default: js-app
      app_test_command:
        description: 'App only: command that runs the app tests (run from app_dir)'
        type: string
        required: false
        default: npm test
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'

concurrency:
  group: browserstack-${{ github.ref }}-${{ github.event.inputs.platform || 'web' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
  BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
  BROWSERSTACK_BUILD_NAME: ${{ github.event.inputs.build_name }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # ---------------------------------------------------------------- WEB
  web:
    name: Web / ${{ github.event.inputs.project || 'js-mocha' }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.event.inputs.project || 'js-mocha' }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask BrowserStack credentials
        run: |
          # Secrets are already masked by GitHub; this also masks the values as
          # they exist in the environment (e.g. if re-derived or printed by tools).
          for v in "$BROWSERSTACK_USERNAME" "$BROWSERSTACK_ACCESS_KEY"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::Set BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY as repository secrets."
            exit 1
          fi

      - name: Set up Node.js
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ github.event.inputs.project || 'js-mocha' }}/package-lock.json

      - name: Set up Java
        if: github.event.inputs.project == 'java-testng'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Install dependencies (JS)
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        run: npm ci

      - name: Run tests on BrowserStack (JS)
        if: startsWith(github.event.inputs.project || 'js-mocha', 'js-')
        run: npm test

      - name: Run tests on BrowserStack (Java)
        if: github.event.inputs.project == 'java-testng'
        run: mvn --batch-mode test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.event.inputs.project || 'js-mocha' }}-logs
          path: |
            ${{ github.event.inputs.project || 'js-mocha' }}/log/
            ${{ github.event.inputs.project || 'js-mocha' }}/logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- APP
  app:
    name: App / ${{ github.event.inputs.app_dir }}
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'app'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.event.inputs.app_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask BrowserStack credentials
        run: |
          for v in "$BROWSERSTACK_USERNAME" "$BROWSERSTACK_ACCESS_KEY"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::Set BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY as repository secrets."
            exit 1
          fi
          if [ -z "${{ github.event.inputs.app }}" ]; then
            echo "::error::Provide the 'app' input (local path or bs:// id)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload app to BrowserStack (if a local file)
        id: upload
        env:
          APP_INPUT: ${{ github.event.inputs.app }}
        run: |
          set -euo pipefail
          if [ -f "$APP_INPUT" ]; then
            # -u reads creds from env so they never appear in the command line / logs
            RESPONSE=$(curl -sS --fail -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
              -F "file=@$APP_INPUT")
            APP_URL=$(echo "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).app_url||""))')
            if [ -z "$APP_URL" ]; then echo "::error::App upload failed"; exit 1; fi
          else
            APP_URL="$APP_INPUT"
          fi
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Using app: $APP_URL"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run app tests on BrowserStack
        env:
          BROWSERSTACK_APP: ${{ steps.upload.outputs.app_url }}
          TEST_COMMAND: ${{ github.event.inputs.app_test_command }}
        run: bash -c "$TEST_COMMAND"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            ${{ github.event.inputs.app_dir }}/log/
            ${{ github.event.inputs.app_dir }}/logs/
          if-no-files-found: ignore
